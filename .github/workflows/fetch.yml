name: Fetch YouTube trends

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (GitHub sometimes starts it a bit late)
  workflow_dispatch:         # adds a "Run workflow" button so you can run it any time

permissions:
  contents: write            # lets the job save the new data back to the repo

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pull charts
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 fetch.py

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "Trends snapshot $(date -u +%F)"
          git push
